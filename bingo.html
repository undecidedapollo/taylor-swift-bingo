<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taylor Swift Music Bingo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        .no-print {
          display: none;
        }
      }
      * {
        /* Print blocked-cell colors even if "Background graphics" is off */
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      @page {
        size: letter;
        margin: 0.5in;
      }
      body {
        font-family: "Montserrat", sans-serif;
        margin: 0;
        padding: 0;
        background-color: white;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: space-between;
        height: 10in; /* Adjusted for 0.5in margins */
        width: 7.5in; /* Adjusted for 0.5in margins */
      }
      .container {
        width: 3.65in;
        height: 4.9in;
        padding: 0.1in;
        box-sizing: border-box;
        display: inline-table;
      }
      h1 {
        font-family: "Bebas Neue", cursive;
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 5px;
      }
      .bingo-board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        border: 1px solid black;
        width: 100%;
        height: calc(99% - 30px); /* Adjust based on h1 height */
        white-space: pre-line;
      }
      .bingo-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-right: 1px solid black;
        border-bottom: 1px solid black;
        font-size: 0.67rem;
        line-height: 1.1;
        overflow: hidden;
        height: 5.15rem;
      }
      .long-word {
        /* Break very long one-word titles (e.g. "imgonnagetyouback") instead of clipping them */
        overflow-wrap: anywhere;
      }
      .bingo-cell:nth-child(5n) {
        border-right: none;
      }
      .bingo-cell:nth-child(n + 21) {
        border-bottom: none;
      }
      .warning {
        background: #fff3cd;
        border: 1px solid #c9a227;
        padding: 4px 8px;
        margin-top: 4px;
      }
      @media screen {
        body {
          height: 100vh;
          width: 100vw;
          justify-content: center;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print">
      <button onclick="nextTemplate()">Next Template</button>
      <button onclick="generateAllBoardsGlobal?.()">Regenerate Boards</button>
      <span id="template-name"></span>
      <div id="warnings"></div>
    </div>
    <div id="content"></div>
    <script src="templates.js"></script>
    <script>
      const numBoards = 64;
      let innerHtml = ``;
      for (let i = 0; i < numBoards; i++) {
        innerHtml += `
          <div class="container">
            <h1></h1>
            <div class="bingo-board"></div>
          </div>
        `;
      }
      document.getElementById("content").innerHTML = innerHtml;

      if (typeof templateOrder === "undefined") {
        document.getElementById("warnings").innerHTML =
          '<div class="warning">templates.js did not load. It is missing or has a typo (often a missing quote or comma). Check the browser console for the line number.</div>';
        throw new Error("templates.js did not load");
      }

      const lastTemplateId = localStorage.getItem("lastTemplate");
      let template =
        templateOrder.find((t) => t.id === lastTemplateId) ?? templateOrder[0];
      let generateAllBoardsGlobal;

      function nextTemplate() {
        template =
          templateOrder[
            (templateOrder.indexOf(template) + 1) % templateOrder.length
          ];
        applyTemplate();
        localStorage.setItem("lastTemplate", template.id);
      }

      function applyTemplate() {
        document.title = template.title;
        Array.from(document.getElementsByTagName("h1")).forEach(
          (h1) => (h1.innerText = template.title)
        );

        // Standard 5x5 pattern
        const patternStandard = [
          "O", "O", "O", "O", "O",
          "O", "O", "O", "O", "O",
          "O", "O", "I", "O", "O",
          "O", "O", "O", "O", "O",
          "O", "O", "O", "O", "O",
        ];

        // 13 pattern (blocked cells form "13" shape)
        const pattern13 = [
          "O", "X", "O", "O", "O",
          "O", "X", "X", "X", "O",
          "O", "X", "I", "O", "O",
          "O", "X", "X", "X", "O",
          "O", "X", "O", "O", "O",
        ];

        // Heart pattern (blocked cells form a heart outline)
        const patternHeart = [
          "O", "X", "O", "X", "O",
          "X", "O", "X", "O", "X",
          "X", "O", "I", "O", "X",
          "O", "X", "O", "X", "O",
          "O", "O", "X", "O", "O",
        ];

        // Select pattern based on template
        const patterns = { "13": pattern13, heart: patternHeart };
        const pattern = patterns[template.pattern] ?? patternStandard;

        document.getElementById("template-name").textContent =
          `Template: ${template.name} (${templateOrder.indexOf(template) + 1} of ${templateOrder.length})`;
        showWarnings(pattern.filter((cell) => cell === "O").length);

        const headerColors = template.headerColors ?? ["#000000"];

        Array.from(document.getElementsByTagName("h1")).forEach(
          (h1) =>
            (h1.style.color =
              headerColors[Math.floor(Math.random() * headerColors.length)])
        );

        let songUsageCount = {};
        let songPositionCount = {};
        let lastBoardSongs = new Set();

        function getWeightedRandomSong(availableSongs, position) {
          const totalWeight = availableSongs.reduce((sum, song) => {
            const usageWeight = 1 / (songUsageCount[song] || 1);
            const positionWeight =
              1 / (songPositionCount[`${song}-${position}`] || 1);
            return sum + usageWeight * positionWeight;
          }, 0);

          let random = Math.random() * totalWeight;

          for (const song of availableSongs) {
            const usageWeight = 1 / (songUsageCount[song] || 1);
            const positionWeight =
              1 / (songPositionCount[`${song}-${position}`] || 1);
            const weight = usageWeight * positionWeight;
            if (random < weight) return song;
            random -= weight;
          }

          return availableSongs[availableSongs.length - 1];
        }

        function generateBoard(board) {
          board.innerHTML = "";
          const availableSongs = template.items.filter(
            (song) => !lastBoardSongs.has(song)
          );

          const newBoardSongs = new Set();

          const blockedColor = template.blockedCellColors
            ? template.blockedCellColors[Math.floor(Math.random() * template.blockedCellColors.length)]
            : "#E5E5E5";

          pattern.forEach((cell, index) => {
            const cellElement = document.createElement("div");
            cellElement.className = "bingo-cell";

            if (cell === "O") {
              if (availableSongs.length === 0) {
                availableSongs.push(
                  ...template.items.filter((song) => !newBoardSongs.has(song))
                );
              }
              const song = getWeightedRandomSong(availableSongs, index);
              const songIndex = availableSongs.indexOf(song);
              availableSongs.splice(songIndex, 1);

              cellElement.textContent = song;
              if (song.split(/\s+/).some((word) => word.length > 12)) {
                cellElement.classList.add("long-word");
              }

              newBoardSongs.add(song);
              songUsageCount[song] = (songUsageCount[song] || 0) + 1;
              songPositionCount[`${song}-${index}`] =
                (songPositionCount[`${song}-${index}`] || 0) + 1;
            } else if (cell === "X") {
              cellElement.style.backgroundColor = blockedColor;
            } else if (cell === "I") {
              cellElement.style.fontWeight = "bold";
              cellElement.style.position = "relative";
              cellElement.style.overflow = "hidden";

              // Scatter small sparkle stars around the cell
              const sparkleContainer = document.createElement("div");
              sparkleContainer.style.position = "absolute";
              sparkleContainer.style.inset = "0";
              sparkleContainer.style.pointerEvents = "none";

              const starPoints = "4,0 5,3 8,4 5,5 4,8 3,5 0,4 3,3";
              const colors = ["#FFD700", "#FFC107", "#FFEB3B", "#FFF176", "#DAA520", "#F5D060"];
              const positions = [
                [8, 8, 10], [75, 5, 8], [20, 75, 9], [85, 70, 11], [50, 10, 7],
                [10, 45, 6], [88, 40, 8], [30, 12, 7], [65, 80, 9], [5, 75, 6],
                [92, 15, 7], [45, 85, 8], [70, 20, 6], [15, 20, 5], [80, 85, 7],
                [55, 5, 5], [25, 90, 6], [90, 55, 5], [3, 60, 7], [60, 90, 6],
              ];

              positions.forEach(([x, y, size]) => {
                const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                s.setAttribute("viewBox", "0 0 8 8");
                s.style.position = "absolute";
                s.style.left = x + "%";
                s.style.top = y + "%";
                s.style.width = size + "px";
                s.style.height = size + "px";
                s.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
                const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                p.setAttribute("points", starPoints);
                p.setAttribute("fill", colors[Math.floor(Math.random() * colors.length)]);
                s.appendChild(p);
                sparkleContainer.appendChild(s);
              });

              cellElement.appendChild(sparkleContainer);

              const text = document.createElement("span");
              text.textContent = template.freespace.replace(" ", "\n");
              text.style.position = "relative";
              text.style.zIndex = "1";
              text.style.fontSize = "0.65rem";
              text.style.color = "#000";
              text.style.textShadow = "0 0 3px rgba(255,255,255,0.8)";
              cellElement.appendChild(text);
            }

            board.appendChild(cellElement);
          });

          lastBoardSongs = newBoardSongs;
        }

        function generateAllBoards() {
          const boards = document.querySelectorAll(".bingo-board");
          boards.forEach((board) => generateBoard(board));
        }

        generateAllBoardsGlobal = generateAllBoards;

        // Generate initial boards
        generateAllBoards();
      }

      // On-screen (never printed) checks for common mistakes in templates.js
      function showWarnings(songsPerBoard) {
        const warnings = [];
        const seen = new Set();
        const duplicates = new Set();
        template.items.forEach((song) => {
          const key = song.trim().toLowerCase();
          if (seen.has(key)) duplicates.add(song);
          seen.add(key);
        });
        if (seen.size < songsPerBoard) {
          warnings.push(
            `This template has ${seen.size} different songs but each board needs ${songsPerBoard}. Add more songs.`
          );
        }
        if (duplicates.size > 0) {
          warnings.push(`Listed more than once: ${[...duplicates].join(", ")}`);
        }
        if (seen.has(template.freespace.trim().toLowerCase())) {
          warnings.push(`"${template.freespace}" is both the free space and a song.`);
        }
        const box = document.getElementById("warnings");
        box.innerHTML = "";
        warnings.forEach((message) => {
          const div = document.createElement("div");
          div.className = "warning";
          div.textContent = message;
          box.appendChild(div);
        });
      }

      // Add keyboard event listener
      document.addEventListener("keydown", function (event) {
        if (event.key === "g" || event.key === "G") {
          generateAllBoardsGlobal?.();
        }
      });
      applyTemplate();
    </script>
  </body>
</html>
