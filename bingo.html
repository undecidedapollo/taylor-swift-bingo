<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taylor Swift Music Bingo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        .no-print {
          display: none;
        }
      }
      @page {
        size: letter;
        margin: 0.5in;
      }
      .content {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: "Montserrat", sans-serif;
        margin: 0;
        padding: 0;
        background-color: white;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: space-between;
        height: 10in; /* Adjusted for 0.5in margins */
        width: 7.5in; /* Adjusted for 0.5in margins */
      }
      .container {
        width: 3.65in;
        height: 4.9in;
        padding: 0.1in;
        box-sizing: border-box;
        display: inline-table;
      }
      h1 {
        font-family: "Bebas Neue", cursive;
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 5px;
      }
      .bingo-board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        border: 1px solid black;
        width: 100%;
        height: calc(99% - 30px); /* Adjust based on h1 height */
        white-space: pre-line;
      }
      .bingo-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-right: 1px solid black;
        border-bottom: 1px solid black;
        font-size: 0.67rem;
        line-height: 1.1;
        overflow: hidden;
        height: 5.15rem;
        /* padding: 2px; */
      }
      .bingo-cell:nth-child(5n) {
        border-right: none;
      }
      .bingo-cell:nth-child(n + 21) {
        border-bottom: none;
      }
      .center-image {
        background-image: url("free_spot.png");
        background-size: cover;
        background-position: center;
      }
      @media screen {
        body {
          height: 100vh;
          width: 100vw;
          justify-content: center;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="no-print">
      <button onclick="nextTemplate()">Next Template</button>
      <button onclick="generateAllBoardsGlobal?.()">Regenerate Boards</button>
    </div>
    <div id="content"></div>
    <script>
      const numBoards = 64;
      const boardTitle = "Taylor Swift Music Bingo";
      let innerHtml = ``;
      for (let i = 0; i < numBoards; i++) {
        innerHtml += `
          <div class="container">
            <h1>${boardTitle}</h1>
            <div class="bingo-board"></div>
          </div>
        `;
      }
      document.getElementById("content").innerHTML = innerHtml;

      // Taylor Swift album colors
      const taylorColors = [
        "#1DB4A4",  // Taylor Swift (debut) - teal
        "#C9A227",  // Fearless - gold
        "#8B5CF6",  // Speak Now - purple
        "#991B1B",  // Red
        "#7DD3FC",  // 1989 - sky blue
        "#1F2937",  // Reputation - dark
        "#F9A8D4",  // Lover - pink
        "#9CA3AF",  // folklore - gray
        "#B45309",  // evermore - amber/brown
        "#1E3A5F",  // Midnights - navy
        "#78716C",  // TTPD - stone
      ];

      const taylorRegular = {
        title: "Taylor Swift Music Bingo",
        freespace: "Blank Space",
        headerColors: taylorColors,
        items: [
          "Teardrops On My Guitar",
          "Should've Said No",
          "Fearless",
          "Breathe",
          "The Way I Loved You",
          "Forever & Always",
          "Back to December",
          "Mine",
          "Speak Now",
          "The Moment I Knew",
          "Begin Again",
          "Come Back...Be Here",
          "Style",
          "Clean",
          "Don't Blame Me",
          "This Is Why We Can't Have Nice Things",
          "Look What You Made Me Do",
          "Gorgeous",
          "I Forgot That You Existed",
          "London Boy",
          "Daylight",
          "Cornelia Street",
          "The 1",
          "August",
          "Invisible String",
          "My Tears Ricochet",
          "'Tis The Damn Season",
          "Evermore",
          "Maroon",
          "Karma",
          "Paris",
          "Question…?",
          "The Black Dog",
          "The Tortured Poets Department",
          "Guilty as Sin?",
          "But Daddy I Love Him",
          "imgonnagetyouback",
          "The Fate of Ophelia",
          "Elizabeth Taylor",
          "Father Figure",
          "Ruin The Friendship",
        ],
      };

      const taylor13 = {
        title: "Taylor Swift Music Bingo",
        freespace: "Blank Space",
        headerColors: ["#1E3A5F"],
        blockedCellColors: [
          "#BDCFB7", "#E8C490", "#BEA7C4", "#6D3D46", "#C2E2F4",
          "#EAB4CC", "#CC9D83",
        ],
        pattern: "13",
        items: [
          "You All Over Me",
          "Mr. Perfectly Fine",
          "We Were Happy",
          "That's When",
          "Don't You",
          "Bye Bye Baby",
          "If This was A Movie",
          "Crazier",
          "Electric Touch",
          "When Emma Falls in Love",
          "Castles Crumbling",
          "Foolish One",
          "Timeless",
          "Better Man",
          "Nothing New",
          "Babe",
          "Message In a Bottle",
          "I Bet You Think About Me",
          "Forever Winter",
          "Run",
          "The Very First Night",
          "All Too Well",
          "Is It Over Now?",
          '"Slut!"',
          "Say Don't Go",
          "Now That We Don't Talk",
          "Suburban Legends",
          "Safe & Sound",
          "Carolina",
          "Macavity",
          "Beautiful Ghosts",
          "Ronan",
          "Sweeter Than Fiction",
          "Christmas Tree Farm",
          "You're Losing Me",
          "All Of The Girls You Loved Before",
          "I Can See You",
        ],
      };

      const templateOrder = [taylorRegular, taylor13];
      const lastTemplate = localStorage.getItem("lastTemplate");
      let template = templateOrder.find(t => t.title === lastTemplate) ?? taylorRegular;
      let generateAllBoardsGlobal;


      function nextTemplate() {
        template =
          templateOrder[
            (templateOrder.indexOf(template) + 1) % templateOrder.length
          ];
        applyTemplate();
        localStorage.setItem("lastTemplate", template.title);
      }

      function applyTemplate() {
        document.title = template.title;
        Array.from(document.getElementsByTagName("h1")).forEach(
          (h1) => (h1.innerText = template.title)
        );

        // Standard 5x5 pattern
        const patternStandard = [
          "O", "O", "O", "O", "O",
          "O", "O", "O", "O", "O",
          "O", "O", "I", "O", "O",
          "O", "O", "O", "O", "O",
          "O", "O", "O", "O", "O",
        ];

        // 13 pattern (blocked cells form "13" shape)
        const pattern13 = [
          "O", "X", "O", "O", "O",
          "O", "X", "X", "X", "O",
          "O", "X", "I", "O", "O",
          "O", "X", "X", "X", "O",
          "O", "X", "O", "O", "O",
        ];

        // Select pattern based on template
        const pattern = template.pattern === "13" ? pattern13 : patternStandard;

        const headerColors = template.headerColors ?? ["#000000"];

        Array.from(document.getElementsByTagName("h1")).forEach(
          (h1) =>
            (h1.style.color =
              headerColors[Math.floor(Math.random() * headerColors.length)])
        );

        let songUsageCount = {};
        let songPositionCount = {};
        let lastBoardSongs = new Set();
        let colorIdx = 0;

        function getColor(item) {
          // if (things.commercials.includes(item)) {
          //   // Returns a blue color
          //   return "#B3E5FC";
          // } else if (things.football.includes(item)) {
          //   // Returns a green color
          //   return "#C8E6C9";
          // } else if (things.celebrity.includes(item)) {
          //   // Returns a purple color
          //   return "#FFF9C4";
          // }
          return "#FFFFFF";
        }

        function getWeightedRandomSong(availableSongs, position) {
          const totalWeight = availableSongs.reduce((sum, song) => {
            const usageWeight = 1 / (songUsageCount[song] || 1);
            const positionWeight =
              1 / (songPositionCount[`${song}-${position}`] || 1);
            return sum + usageWeight * positionWeight;
          }, 0);

          let random = Math.random() * totalWeight;

          for (const song of availableSongs) {
            const usageWeight = 1 / (songUsageCount[song] || 1);
            const positionWeight =
              1 / (songPositionCount[`${song}-${position}`] || 1);
            const weight = usageWeight * positionWeight;
            if (random < weight) return song;
            random -= weight;
          }

          return availableSongs[availableSongs.length - 1];
        }

        function generateBoard(board) {
          board.innerHTML = "";
          const availableSongs = template.items.filter(
            (song) => !lastBoardSongs.has(song)
          );

          const newBoardSongs = new Set();

          const blockedColor = template.blockedCellColors
            ? template.blockedCellColors[Math.floor(Math.random() * template.blockedCellColors.length)]
            : "#E5E5E5";

          pattern.forEach((cell, index) => {
            const cellElement = document.createElement("div");
            cellElement.className = "bingo-cell";

            if (cell === "O") {
              if (availableSongs.length === 0) {
                availableSongs.push(
                  ...template.items.filter((song) => !newBoardSongs.has(song))
                );
              }
              const song = getWeightedRandomSong(availableSongs, index);
              const songIndex = availableSongs.indexOf(song);
              availableSongs.splice(songIndex, 1);

              cellElement.textContent = song;
              // cellElement.style.backgroundColor = "white";
              cellElement.style.backgroundColor = getColor(song);

              newBoardSongs.add(song);
              songUsageCount[song] = (songUsageCount[song] || 0) + 1;
              songPositionCount[`${song}-${index}`] =
                (songPositionCount[`${song}-${index}`] || 0) + 1;
            } else if (cell === "X") {
              cellElement.style.backgroundColor = blockedColor;
            } else if (cell === "I") {
              cellElement.textContent = template.freespace;
              cellElement.style.fontWeight = "bold";
            }

            board.appendChild(cellElement);
          });

          lastBoardSongs = newBoardSongs;
        }

        function generateAllBoards() {
          const boards = document.querySelectorAll(".bingo-board");
          boards.forEach((board) => generateBoard(board));
        }

        generateAllBoardsGlobal = generateAllBoards;

        // Generate initial boards
        generateAllBoards();
      }

      // Add keyboard event listener
      document.addEventListener("keydown", function (event) {
        if (event.key === "g" || event.key === "G") {
          generateAllBoardsGlobal?.();
        }
      });
      applyTemplate();
    </script>
  </body>
</html>
